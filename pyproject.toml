[project]
name = "clinical-agent"
version = "0.1.0"
description = "Research agent for clinical development teams designing clinical trials"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["libs/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"services/agent/src/agent/prompts.py" = ["E501"]  # prose

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
