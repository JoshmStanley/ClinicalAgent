[project]
name = "agent"
version = "0.1.0"
description = "LLM gateway and agent loop: executes runs, streams events, reports usage"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "langfuse>=3.0",
    "anthropic>=0.69",
    "mcp>=1.10",
    "langgraph>=1.0",
    "langchain-core>=1.0",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
