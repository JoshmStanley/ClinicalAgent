[project]
name = "financials"
version = "0.1.0"
description = "Budgets, quotas by role, and LLM usage ledger"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financials"]
