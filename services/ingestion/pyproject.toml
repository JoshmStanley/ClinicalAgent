[project]
name = "ingestion"
version = "0.1.0"
description = "Kafka workers: converter -> sections -> chunker -> embed"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "pypdf>=5.0",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
