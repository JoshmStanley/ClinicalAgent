[project]
name = "identity"
version = "0.1.0"
description = "Users, organizations, memberships and roles (synced from Clerk)"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "svix>=1.30",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]
