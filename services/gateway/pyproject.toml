[project]
name = "gateway"
version = "0.1.0"
description = "Public API gateway: auth, budget checks, routing, SSE passthrough"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
