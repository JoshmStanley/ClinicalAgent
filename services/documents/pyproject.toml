[project]
name = "documents"
version = "0.1.0"
description = "Document upload, metadata, and hybrid chunk search with citations"
requires-python = ">=3.12"
dependencies = [
    "clinical-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
clinical-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents"]
