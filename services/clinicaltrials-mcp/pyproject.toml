[project]
name = "clinicaltrials-mcp"
version = "0.1.0"
description = "MCP server exposing ClinicalTrials.gov API v2 as tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinicaltrials_mcp"]
