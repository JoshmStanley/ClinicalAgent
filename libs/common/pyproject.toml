[project]
name = "clinical-common"
version = "0.1.0"
description = "Shared auth, config, db, kafka, storage, search, and event schemas for ClinicalAgent services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiokafka>=0.12",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "voyageai>=0.3",
    "opensearch-py[async]>=2.7",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_common"]
